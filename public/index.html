<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Document</title>
</head>

<body>

  <div id="div1">

    <div id="header">
      <i class="fa-solid fa-cloud-sun"></i>
      <span>Weather App</span>
    </div>

    <form id="form1">
      <input id="inp1" type="text" placeholder="Enter country name" />
      <button id="btn1">Get Weather</button>
      <span id="span1"> Enter country name</span>
    </form>

  </div>



  <div id="div2">
    <h2>
      <i class="fa-solid fa-cloud-sun"></i>
      <span>Weather App</span>
    </h2>

    <form id="form2">
      <div id="location">
        <input id="inp2" type="text">
        <button id="load"><i class="fa-solid fa-spinner fa-spin"></i></button>
      </div>
      <button id="btn2">Get Weather</button>
    </form>

    <div id="d1">
      <i class="fa-solid fa-earth-americas icon"></i>
      <span id="country1"></span>
    </div>

    <div id="d2">
      <i class="fa-solid fa-location-arrow"></i>
      <span id="lat"></span>
    </div>

    <div id="d3">
      <i class="fa-solid fa-compass"></i>
      <span id="long"></span>
    </div>

    <div id="d4">
      <i class="fa-solid fa-temperature-half"></i>
      <span id="temp"></span>
    </div>

  </div>


  <script src="js/script.js"></script>

</body>

</html>
